<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {

    :root:not([data-theme="light"]) {

      --line: #2C3733; --accent: #5FBF93; --accent-soft: #1F3A2E; --done: #5FBF93;
      --warn: #E0B25A; --warn-soft: #3A2E12; --T: #5FBF93; --C: #8FB0F0; --N: #E0B25A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #131917; --paper: #1B2320; --ink: #EAF0EC; --muted: #A9B5AF; --faint: #7B877F;
    --line: #2C3733; --accent: #5FBF93; --accent-soft: #1F3A2E; --done: #5FBF93;

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 80px; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground);

  .top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .legend { display: inline-flex; gap: 8px; margin-left: auto; }

  .item { border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .fila { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; }
  .fila input[type=checkbox] { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--done); cursor: pointer; }
  .titulo { font-weight: 500; }
  .titulo .meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .listo { font-size: 13px; color: var(--muted); }
  .listo b { color: var(--ink); font-weight: 600; }
  .item.done .titulo { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .item.done .fila { background: color-mix(in srgb, var(--accent-soft) 45%, var(--paper)); }
  .derecha { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .tiempo { display: inline-flex; align-items: center; gap: 4px; font: 400 12px "IBM Plex Mono", ui-monospace, monospace; color: var(--faint); }
  .tiempo input { width: 52px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink);
    font: inherit; text-align: right; }
  .tiempo input:focus, .fila input[type=checkbox]:focus-visible, .mas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mas { background: none; border: 0; color: var(--accent); font: 500 13px "IBM Plex Sans", sans-serif; cursor: pointer; padding: 2px 0; }
  .mas::before { content: "▸ "; font-size: 11px; }
  .item.abierto .mas::before { content: "▾ "; }
  .detalle { display: none; padding: 0 14px 14px 54px; }
  .item.abierto .detalle { display: block; }
  .detalle dl { display: grid; grid-template-columns: 82px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .detalle dt { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 3px; }
  .detalle dd { margin: 0; color: var(--ink); max-width: 62ch; }
  .detalle dd ol, .detalle dd ul { margin: 4px 0 0; padding-left: 18px; }
  .detalle dd li { margin: 2px 0; }
  .detalle code { font: 13px "IBM Plex Mono", ui-monospace, monospace; background: var(--ground); padding: 1px 5px; border-radius: 4px; }
  .aviso { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
  @media (max-width: 520px) {
    .fila { grid-template-columns: 28px 1fr; }
    .derecha { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; }
    .detalle { padding-left: 14px; }
    .detalle dl { grid-template-columns: 1fr; gap: 2px; }
    .detalle dt { margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

// ---- Estado: {items: {id: {done, min, cuando}}}. Se guarda en la base del artefacto (compartida) y, si no hay, en el navegador.
let estado = {items: {}};
let guardar = null;          // función que persiste (db o localStorage)
const $ = (s, el=document) => el.querySelector(s);

function limpiar(items){
  // Sin nulos ni vacíos: algunos almacenes los rechazan, y no aportan nada.
  const out = {};
  for (const [k, v] of Object.entries(items || {})){
    const o = {};
    if (v && v.done) { o.done = true; if (v.cuando) o.cuando = String(v.cuando); }
    if (v && v.min !== undefined && v.min !== "" && v.min !== null) o.min = String(v.min);
    if (Object.keys(o).length) out[k] = o;
  }
  return out;
}

function render(){
  const main = $("#main");
  const ocultar = $("#ocultar").checked;
  const abiertos = new Set([...document.querySelectorAll(".item.abierto")].map(e => e.dataset.id));
  main.innerHTML = "";
  let hechos = 0;
  for (const [bid, titulo, intro] of BLOQUES){
    const items = ITEMS.filter(i => i.b === bid);
    const sec = document.createElement("section"); sec.className = "bloque";
    const nHechos = items.filter(i => (estado.items[i.id]||{}).done).length;
    hechos += nHechos;
    sec.innerHTML = `<h2>${titulo} <span class="n">${nHechos}/${items.length}</span></h2><p class="intro">${intro}</p><div class="lista"></div>`;
    const lista = $(".lista", sec);
    for (const it of items){
      const st = estado.items[it.id] || {};
      if (ocultar && st.done) continue;
      const d = document.createElement("div");
      d.className = "item" + (st.done ? " done" : "") + (abiertos.has(it.id) ? " abierto" : "");
      d.dataset.id = it.id;
      d.innerHTML = `
        <div class="fila">
          <input type="checkbox" id="chk_${it.id}" ${st.done ? "checked" : ""} aria-label="hecho: ${it.t}">
          <div class="titulo"><label for="chk_${it.id}">${it.t}</label>
            <div class="meta"><span class="who ${it.who}">${it.who}</span><span class="listo">listo cuando: <b>${it.listo}</b></span></div>
            <button class="mas" type="button" aria-expanded="${abiertos.has(it.id)}">cómo · para qué · por qué</button>
          </div>
          <div class="derecha"><span class="tiempo"><input type="text" inputmode="numeric" id="min_${it.id}" value="${st.min ?? ""}" placeholder="min" aria-label="minutos que tardó"> min</span></div>
        </div>
        <div class="detalle"><dl>
          <dt>Cómo</dt><dd>${it.como}</dd>
          <dt>Para qué</dt><dd>${it.paraque}</dd>
          <dt>Por qué</dt><dd>${it.porque}</dd>
        </dl></div>`;
      $("input[type=checkbox]", d).addEventListener("change", e => {
        const cur = {...(estado.items[it.id]||{})};
        cur.done = e.target.checked;
        if (cur.done) cur.cuando = new Date().toISOString().slice(0,10); else delete cur.cuando;
        estado.items[it.id] = cur;
        log("click " + it.id + "=" + cur.done + " frozen=" + Object.isFrozen(estado.items));
        // Se actualiza la fila en el lugar, sin reconstruir la lista: así el click nunca se pierde.
        d.classList.toggle("done", cur.done);
        actualizarCabecera();
        persistir();
        if (ocultar && cur.done) d.remove();
      });
      let tmr;
      $(`#min_${it.id}`, d).addEventListener("input", e => {
        estado.items[it.id] = {...(estado.items[it.id]||{}), min: e.target.value.replace(/[^\d]/g,"")};
        actualizarCabecera();
        clearTimeout(tmr); tmr = setTimeout(persistir, 800);
      });
      $(".mas", d).addEventListener("click", () => {
        d.classList.toggle("abierto"); $(".mas", d).setAttribute("aria-expanded", d.classList.contains("abierto"));
      });
      lista.appendChild(d);
    }
    if (!lista.children.length){ lista.innerHTML = `<div class="fila" style="color:var(--faint)">todo hecho</div>`; }
    main.appendChild(sec);
  }
  actualizarCabecera();
}

function actualizarCabecera(){
  const total = ITEMS.length;
  const hechos = ITEMS.filter(i => (estado.items[i.id]||{}).done).length;
  $("#conteo").textContent = `${hechos} / ${total}`;
  $("#barra").style.width = (100*hechos/total) + "%";
  const minutos = ITEMS.reduce((a,i) => a + (parseInt((estado.items[i.id]||{}).min) || 0), 0);
  if (minutos) $("#conteo").textContent += `  ·  ${Math.round(minutos/60*10)/10} h`;
  for (const [bid] of BLOQUES){
    const items = ITEMS.filter(i => i.b === bid);
    const n = items.filter(i => (estado.items[i.id]||{}).done).length;
    const h2 = [...document.querySelectorAll(".bloque")].find(s => s.querySelector(".item, .fila") && ITEMS.filter(i => i.b===bid).some(i => s.querySelector(`[data-id="${i.id}"]`)));
    if (h2) h2.querySelector("h2 .n").textContent = `${n}/${items.length}`;
  }
}

const LOG = [];
function log(m){ LOG.push(m); if (LOG.length > 4) LOG.shift(); const el = $("#log"); if (el) el.textContent = " · " + LOG.join(" · "); }
function persistir(){ log("persistir " + Object.keys(limpiar(estado.items)).length + " items"); if (guardar) guardar(); }

// Aplica un estado que viene de afuera (otro dispositivo, otra pestaña) solo si cambió algo,
// y nunca mientras se está escribiendo en una casilla.
function aplicar(items){
  const nuevo = limpiar(items);
  if (JSON.stringify(nuevo) === JSON.stringify(limpiar(estado.items))) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT" && document.activeElement.type === "text") return;
  estado = {items: nuevo};
  render();
}

// ---- Persistencia: base compartida del artefacto si está; si no, el navegador.
function usarLocal(motivo){
  try { const s = localStorage.getItem("checklist_navar"); if (s) aplicar(JSON.parse(s).items); } catch(e){}
  guardar = () => { try { localStorage.setItem("checklist_navar", JSON.stringify({items: limpiar(estado.items)})); } catch(e){} };
  $("#sync").textContent = "guardado en este navegador" + (motivo ? " (" + motivo + ")" : "");
}

(async () => {
  render();                                   // primero se ve; después se enchufa
  $("#ocultar").addEventListener("change", render);
  let db = null;
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)); } catch(e){ db = null; }
  if (!db){ usarLocal(); return; }
  const ref = db.doc("checklist/navar");
  let escribiendo = false, pendiente = false;
  guardar = async () => {
    if (escribiendo){ pendiente = true; return; }
    escribiendo = true; $("#sync").textContent = "guardando…";
    try {
      const cuerpo = {items: limpiar(estado.items), actualizado: new Date().toISOString()};
      log("set " + Object.keys(cuerpo.items).length);
      await ref.set(cuerpo);
      $("#sync").textContent = "guardado, compartido";
    } catch(e){
      $("#sync").textContent = "no se pudo guardar (" + ((e && e.code) || "error") + ") — queda en este navegador";
      try { localStorage.setItem("checklist_navar", JSON.stringify({items: limpiar(estado.items)})); } catch(_){}
    }
    escribiendo = false;
    if (pendiente){ pendiente = false; guardar(); }
  };
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites){ log("snap pendiente"); return; }      // lo nuestro, todavía en viaje
    if (snap.exists){ const d = snap.data() || {}; log("snap " + Object.keys(d.items || {}).length + " items"); aplicar(d.items); }
    if (!$("#sync").textContent.startsWith("no se pudo")) $("#sync").textContent = "guardado, compartido";
  }, err => { usarLocal((err && err.code) || "sin conexión"); });
})();
</script>
